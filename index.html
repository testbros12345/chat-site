<!DOCTYPE html>
<html lang="ja">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">

	<title>ChatApp</title>

	<link rel="stylesheet" href="css/style.css">
</head>

<body>

	<div class="chat-app">

		<!-- =========================
         サイドバー
    ========================== -->
		<aside class="sidebar">

			<div class="sidebar-header">
				<h1>ChatApp</h1>

				<button class="new-chat-btn" id="newChatBtn">
					＋
				</button>
			</div>

			<!-- 検索 -->
			<div class="search-box">
				<span>⌕</span>
				<input type="text" id="searchInput" placeholder="チャットを検索">
			</div>

			<!-- チャット一覧 -->
			<div class="chat-list" id="chatList">

				<button class="chat-item active" data-chat="0">

					<div class="avatar avatar-blue">
						Y
					</div>

					<div class="chat-info">
						<div class="chat-name">
							山田 太郎
							<span class="online"></span>
						</div>

						<div class="last-message">
							こんにちは！
						</div>
					</div>

					<div class="chat-meta">
						<span class="chat-time">18:02</span>
						<span class="unread">2</span>
					</div>

				</button>


				<button class="chat-item" data-chat="1">

					<div class="avatar avatar-green">
						S
					</div>

					<div class="chat-info">
						<div class="chat-name">
							佐藤 花子
							<span class="online"></span>
						</div>

						<div class="last-message">
							明日の件ですが
						</div>
					</div>

					<div class="chat-meta">
						<span class="chat-time">17:41</span>
					</div>

				</button>


				<button class="chat-item" data-chat="2">

					<div class="avatar avatar-purple">
						T
					</div>

					<div class="chat-info">
						<div class="chat-name">
							鈴木 一郎
						</div>

						<div class="last-message">
							OKです！
						</div>
					</div>

					<div class="chat-meta">
						<span class="chat-time">16:20</span>
					</div>

				</button>

			</div>

		</aside>


		<!-- =========================
         メインチャット
    ========================== -->
		<main class="chat-main">

			<!-- チャットヘッダー -->
			<header class="chat-header">

				<button class="back-btn" id="backBtn">
					←
				</button>

				<div class="header-user">

					<div class="avatar avatar-blue" id="headerAvatar">
						Y
					</div>

					<div>
						<h2 id="headerName">
							山田 太郎
						</h2>

						<p id="headerStatus">
							オンライン
						</p>
					</div>

				</div>

				<div class="header-actions">

					<button>
						⌕
					</button>

					<button>
						⋮
					</button>

				</div>

			</header>


			<!-- メッセージ -->
			<section class="messages" id="messages">

				<div class="date-divider">
					<span>今日</span>
				</div>


				<!-- 相手 -->
				<div class="message-row received">

					<div class="message-avatar">
						Y
					</div>

					<div class="message-content">

						<div class="message-bubble">
							こんにちは！
						</div>

						<span class="message-time">
							17:58
						</span>

					</div>

				</div>


				<!-- 自分 -->
				<div class="message-row sent">

					<div class="message-content">

						<div class="message-bubble">
							こんにちは！
						</div>

						<span class="message-time">
							18:00
						</span>

					</div>

				</div>


				<!-- 相手 -->
				<div class="message-row received">

					<div class="message-avatar">
						Y
					</div>

					<div class="message-content">

						<div class="message-bubble">
							今日の予定はどうしますか？
						</div>

						<span class="message-time">
							18:01
						</span>

					</div>

				</div>


				<!-- 自分 -->
				<div class="message-row sent">

					<div class="message-content">

						<div class="message-bubble">
							19時くらいに行きましょう！
						</div>

						<span class="message-time">
							18:02
						</span>

					</div>

				</div>

			</section>


			<!-- =========================
             入力エリア
        ========================== -->
			<div class="message-input-area">

				<button class="input-action" id="fileBtn">
					＋
				</button>

				<input type="file" id="fileInput" hidden>

				<div class="message-input-wrapper">

					<input type="text" id="messageInput" placeholder="メッセージを入力..." autocomplete="off">

					<button class="emoji-btn" id="emojiBtn">
						☺
					</button>

				</div>

				<button class="send-btn" id="sendBtn">
					➤
				</button>

			</div>

		</main>

	</div>

	<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
	<script src="js/supabase.js"></script>
	<script src="js/script.js"></script>

</body>

</html>
