<!DOCTYPE html>
<html lang="ja">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">

	<title>ChatApp</title>

	<link rel="stylesheet" href="css/style.css">
</head>

<body>

	<div class="chat-app">

		<!-- =========================
         サイドバー
    ========================== -->
		<aside class="sidebar">

			<div class="sidebar-header">
				<h1>ChatApp</h1>

				<button class="new-chat-btn" id="newChatBtn">
					＋
				</button>
			</div>

			<!-- 検索 -->
			<div class="search-box">
				<span>⌕</span>
				<input type="text" id="searchInput" placeholder="チャットを検索">
			</div>

			<!-- チャット一覧 -->
			<div class="chat-list" id="chatList">
				<!-- JavaScriptでSupabaseのチャット一覧を生成 -->
			</div>

		</aside>


		<!-- =========================
         メインチャット
    ========================== -->
		<main class="chat-main">

			<!-- チャットヘッダー -->
			<header class="chat-header">

				<button class="back-btn" id="backBtn">
					←
				</button>

				<div class="header-user">

					<div class="avatar avatar-blue" id="headerAvatar">
						G
					</div>

					<div>
						<h2 id="headerName">
							公開チャット
						</h2>

						<p id="headerStatus">
							みんなでチャット
						</p>
					</div>

				</div>

				<div class="header-actions">

					<button>
						⌕
					</button>

					<button>
						⋮
					</button>

				</div>

			</header>


			<!-- メッセージ -->
			<section class="messages" id="messages">
				<div class="date-divider">
					<span>今日</span>
				</div>
			</section>


			<!-- =========================
             入力エリア
        ========================== -->
			<div class="message-input-area">

				<button class="input-action" id="fileBtn">
					＋
				</button>

				<input type="file" id="fileInput" hidden>

				<div class="message-input-wrapper">

					<input type="text" id="messageInput" placeholder="メッセージを入力..." autocomplete="off">

					<button class="emoji-btn" id="emojiBtn">
						☺
					</button>

				</div>

				<button class="send-btn" id="sendBtn">
					➤
				</button>

			</div>

		</main>

	</div>

	<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
	<script src="js/supabase.js"></script>
	<script src="js/script.js"></script>

</body>

</html>
